<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Disease ML · Mockup A: Particle heart</title>
  <link rel="stylesheet" href="shared.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
      "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/",
      "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.mjs"
    }
  }
  </script>
  <style>
    .waffle-label {
      position: fixed; z-index: 4; pointer-events: none; font: 500 13px/1.3 var(--font-body);
      color: var(--ink); white-space: nowrap; opacity: 0; transition: opacity 0.5s;
      transform: translate(0, -100%); padding-bottom: 8px;
    }
    .waffle-label .swatch { margin-right: 6px; }
    .waffle-label small { display: block; color: var(--ink-3); font-size: 12px; }
    .waffle-label.on { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <main></main>
  <div class="waffle-label" id="lbl-no"><span class="swatch" style="background:var(--no)"></span>No · <span class="v"></span><small>each dot ≈ <span class="per"></span> people</small></div>
  <div class="waffle-label" id="lbl-yes"><span class="swatch" style="background:var(--accent)"></span>Yes · <span class="v"></span></div>
  <div class="waffle-label" id="lbl-missed" style="transform:none;padding:8px 0 0"><span class="swatch" style="background:var(--missed)"></span>Missed by the model<small class="v"></small></div>

<script type="module">
import * as THREE from "three";
import { initStory, createStage, accentColor, beat, lerp, ease, range, isMobile, sampleHeartPoints } from "./shared.js";

const story = await initStory({ variant: "A", title: "Particle heart", splitKind: "bar", hideSplitCard: true, cardInLeft: true });
const { state, data } = story;
const stage = createStage({ bloom: { strength: 0.45, radius: 0.5, threshold: 0.1 } });
stage.renderer.toneMapping = THREE.NoToneMapping; // keep data colors true to the chart palette

// ---- one dot per ~10 respondents (per ~40 on phones), No first then Yes ----
const mobile = isMobile();
const per = mobile ? 40 : 10;
const nNo = Math.round(data.no / per), nYes = Math.round(data.yes / per), N = nNo + nYes;
const heart = sampleHeartPoints(N);

const rows = mobile ? 60 : 150;
const cols = Math.ceil(N / rows);
const width = mobile ? 2.1 : 3.1;
const cell = width / cols;
const waffle = new Float32Array(N * 3);
const yes = new Float32Array(N), rnd = new Float32Array(N), missed = new Float32Array(N);
const caught = Math.round(nYes * data.first.rec);
for (let i = 0; i < N; i++) {
  const c = Math.floor(i / rows), r = i % rows;
  waffle[i * 3] = -width / 2 + c * cell;
  waffle[i * 3 + 1] = (rows * cell) / 2 - r * cell;
  waffle[i * 3 + 2] = 0;
  yes[i] = i >= nNo ? 1 : 0;
  rnd[i] = Math.random();
  missed[i] = i >= nNo + caught ? 1 : 0; // the Yes dots the first model failed to flag
}
// shuffle which heart position each person gets, so Yes dots are spread through the heart
for (let i = N - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  for (let k = 0; k < 3; k++) [heart[i * 3 + k], heart[j * 3 + k]] = [heart[j * 3 + k], heart[i * 3 + k]];
}

const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(heart, 3));
geo.setAttribute("aWaffle", new THREE.BufferAttribute(waffle, 3));
geo.setAttribute("aYes", new THREE.BufferAttribute(yes, 1));
geo.setAttribute("aRand", new THREE.BufferAttribute(rnd, 1));
geo.setAttribute("aMissed", new THREE.BufferAttribute(missed, 1));

const uniforms = {
  uTime: { value: 0 }, uBeat: { value: 0 }, uMorph: { value: 0 }, uLoosen: { value: 0 },
  uReveal: { value: 0 }, uMissed: { value: 0 }, uRotY: { value: 0 }, uScale: { value: 1 },
  uHeartOffset: { value: new THREE.Vector3() }, uWaffleOffset: { value: new THREE.Vector3() },
  uSize: { value: mobile ? 30 : 21 }, uPixelRatio: { value: stage.renderer.getPixelRatio() },
  uAccent: { value: accentColor() }, uNo: { value: new THREE.Color("#3f7fd1") }, uMissedColor: { value: new THREE.Color("#c98500") },
};
addEventListener("accentchange", () => uniforms.uAccent.value.copy(accentColor()));

const material = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uTime, uBeat, uMorph, uLoosen, uReveal, uMissed, uRotY, uScale, uSize, uPixelRatio;
    uniform vec3 uHeartOffset, uWaffleOffset, uAccent, uNo, uMissedColor;
    attribute vec3 aWaffle; attribute float aYes, aRand, aMissed;
    varying vec3 vColor; varying float vAlpha;
    void main() {
      // heart: beat, slow rotation, a little life in every dot
      vec3 h = position * uScale * (1.0 + uBeat * 0.045);
      float c = cos(uRotY), s = sin(uRotY);
      h = vec3(c * h.x + s * h.z, h.y, -s * h.x + c * h.z);
      vec3 drift = vec3(sin(uTime * 0.6 + aRand * 40.0), cos(uTime * 0.5 + aRand * 31.0), sin(uTime * 0.7 + aRand * 17.0));
      h += drift * (0.01 + uLoosen * 0.3 * aRand) + uHeartOffset;
      // staggered morph into the waffle, with a swirl mid-flight
      float m = smoothstep(aRand * 0.45, aRand * 0.45 + 0.55, uMorph);
      vec3 swirl = vec3(sin(aRand * 6.283 + uTime), cos(aRand * 9.0), sin(aRand * 12.0)) * 0.7 * sin(m * 3.14159);
      vec3 p = mix(h, aWaffle + uWaffleOffset, m) + swirl;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * uPixelRatio / -mv.z * mix(1.0, 0.95, m);
      // everyone is "the heart" until the reveal sorts them into Yes / No
      vec3 col = mix(uAccent, aYes > 0.5 ? uAccent : uNo, uReveal);
      vColor = mix(col, uMissedColor, uMissed * aMissed);
      vAlpha = mix(0.26, 0.62, m);
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vColor; varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.1, d);
      gl_FragColor = vec4(vColor, a * vAlpha);
    }`,
});
stage.scene.add(new THREE.Points(geo, material));

// ---- HTML labels pinned to the waffle ----
const lblNo = document.getElementById("lbl-no"), lblYes = document.getElementById("lbl-yes"), lblMissed = document.getElementById("lbl-missed");
lblNo.querySelector(".v").textContent = `${(data.no / data.rows * 100).toFixed(1)}%`;
lblNo.querySelector(".per").textContent = per;
lblYes.querySelector(".v").textContent = `${(data.yes / data.rows * 100).toFixed(1)}%`;
lblMissed.querySelector(".v").textContent = `${100 - Math.round(data.first.rec * 100)} of every 100 sick people`;
const v = new THREE.Vector3();
function place(el, x, y) {
  v.set(x, y, 0).project(stage.camera);
  el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
  el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
}

stage.loop((dt, t) => {
  story.update(dt);
  const { t1, t2, t3 } = state;
  const m = isMobile();
  // where the heart sits in each scene
  const heroX = m ? 0 : 1.25, topicX = m ? 0 : 1.9, twistX = m ? 0 : 1.95;
  const heroY = m ? 0.35 : 0.15, topicY = m ? 1.35 : 0, twistY = m ? 1.6 : 0.1;
  const a = ease(t1), b = ease(t2);
  uniforms.uHeartOffset.value.set(lerp(lerp(heroX, topicX, a), twistX, b), lerp(lerp(heroY, topicY, a), twistY, b), 0);
  uniforms.uScale.value = lerp(lerp(m ? 0.8 : 1.05, m ? 0.55 : 0.85, a), m ? 0.6 : 0.9, b);
  uniforms.uWaffleOffset.value.set(m ? 0 : 1.95, m ? 1.6 : 0.05, 0);
  uniforms.uLoosen.value = Math.sin(a * Math.PI) * 0.6;
  uniforms.uMorph.value = range(t3, 0.28, 0.44);
  uniforms.uReveal.value = range(t3, 0.4, 0.52);
  uniforms.uMissed.value = range(t3, 0.68, 0.8);
  uniforms.uBeat.value = beat(t) * (1 - uniforms.uMorph.value);
  uniforms.uRotY.value = t * 0.22 + state.drag;
  uniforms.uTime.value = t;
  stage.camera.position.x = lerp(stage.camera.position.x, state.mx * 0.18 * (1 - t1), 0.05);
  stage.camera.position.y = lerp(stage.camera.position.y, -state.my * 0.12 * (1 - t1), 0.05);
  stage.camera.lookAt(0, 0, 0);

  // labels follow the waffle's corners
  const wx = uniforms.uWaffleOffset.value.x, wy = uniforms.uWaffleOffset.value.y, top = wy + (rows * cell) / 2;
  const yesX = wx - width / 2 + Math.floor(nNo / rows) * cell;
  place(lblNo, wx - width / 2, top);
  place(lblYes, yesX, top);
  place(lblMissed, yesX, wy - (rows * cell) / 2);
  const showWaffle = state.step >= 1 && uniforms.uReveal.value > 0.6;
  lblNo.classList.toggle("on", showWaffle);
  lblYes.classList.toggle("on", showWaffle);
  lblMissed.classList.toggle("on", state.step === 2 && uniforms.uMissed.value > 0.6);
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Disease ML · Mockup B: Anatomical heart</title>
  <link rel="stylesheet" href="shared.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
      "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/",
      "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.mjs"
    }
  }
  </script>
  <style>
    .model-note { position: fixed; left: 14px; bottom: 14px; z-index: 40; font-size: 11px; color: var(--ink-3);
      padding: 6px 10px; border: 1px dashed var(--ink-3); border-radius: 8px; background: rgba(7,8,11,.7); }
    @media (max-width: 760px) { .model-note { display: none; } }
  </style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <main></main>
  <div class="model-note" id="model-note">Stand-in heart: drop a CC-licensed model at mockups/models/heart.glb</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { initStory, createStage, accentColor, driveMeshHeart, makeHeartGeometry, volumeCut, addSplitShader } from "./shared.js";

const story = await initStory({ variant: "B", title: "Anatomical heart" });
const { state, data } = story;
const stage = createStage({ bloom: { strength: 0.35, radius: 0.6, threshold: 0.55 } });
const { scene, renderer } = stage;
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// cinematic lighting: dim key, strong red rim from behind
scene.add(new THREE.AmbientLight(0xffffff, 0.08));
const key = new THREE.DirectionalLight(0xfff1e8, 1.4); key.position.set(-3, 2, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xff2a3a, 5); rim.position.set(3, 1.5, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight(0x6a8cff, 1.2); rim2.position.set(-4, -1, -3); scene.add(rim2);

const split = {
  uSplit: { value: 0 }, uCut: { value: 0.1 }, uMinY: { value: -1 }, uMaxY: { value: 1 },
  uNoColor: { value: new THREE.Color("#3f7fd1") },
};
const material = new THREE.MeshPhysicalMaterial({
  color: accentColor(), roughness: 0.42, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.35,
  sheen: 1, sheenRoughness: 0.5, sheenColor: new THREE.Color("#ff6f6f"),
});
addSplitShader(material, split);
addEventListener("accentchange", () => material.color.copy(accentColor()));

const group = new THREE.Group();
scene.add(group);

function useBounds(minY, maxY) {
  split.uMinY.value = minY;
  split.uMaxY.value = maxY;
  split.uCut.value = volumeCut(data.yes / data.rows, minY, maxY);
}

// Stand-in: the implicit heart, tilted like a real one, plus the great vessels as tubes
function standIn() {
  const body = new THREE.Mesh(makeHeartGeometry(6), material);
  body.geometry.computeBoundingBox();
  const { min, max } = body.geometry.boundingBox;
  useBounds(min.y, max.y);
  const inner = new THREE.Group();
  inner.add(body);
  const tube = (pts, r) => new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(...p))), 48, r, 20, false), material);
  inner.add(tube([[0.15, 0.6, 0], [0.2, 1.25, 0.05], [0.0, 1.55, -0.1], [-0.45, 1.45, -0.2], [-0.6, 0.95, -0.3]], 0.17)); // aorta
  inner.add(tube([[-0.15, 0.55, 0.25], [-0.25, 1.05, 0.3], [-0.55, 1.2, 0.15], [-0.85, 1.15, 0.0]], 0.13));             // pulmonary trunk
  inner.add(tube([[0.45, 0.6, -0.15], [0.5, 1.15, -0.2], [0.55, 1.55, -0.2]], 0.1));                                    // vena cava
  inner.rotation.z = -0.38;
  inner.position.y = -0.2;
  inner.scale.setScalar(0.92);
  return inner;
}

let heart = standIn();
group.add(heart);

// A real model replaces the stand-in when it exists
new GLTFLoader().load("models/heart.glb", (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const s = 2.6 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(s);
  model.position.sub(box.getCenter(new THREE.Vector3()).multiplyScalar(s));
  model.traverse((o) => { if (o.isMesh) o.material = material; });
  // the split shader uses object-space y; with a real model we fall back to height fraction
  split.uMinY.value = box.min.y; split.uMaxY.value = box.max.y; split.uCut.value = data.yes / data.rows;
  group.remove(heart);
  heart = model;
  group.add(heart);
  document.getElementById("model-note").remove();
}, undefined, () => { /* no model yet: keep the stand-in */ });

stage.loop((dt, t) => {
  story.update(dt);
  driveMeshHeart(group, state, t, split);
});
</script>
</body>
</html>

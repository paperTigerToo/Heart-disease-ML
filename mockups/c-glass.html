<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Disease ML · Mockup C: Glass heart</title>
  <link rel="stylesheet" href="shared.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
      "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/",
      "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.mjs"
    }
  }
  </script>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <main></main>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { initStory, createStage, accentColor, driveMeshHeart, makeHeartGeometry, volumeCut, addSplitShader, beat } from "./shared.js";

const story = await initStory({ variant: "C", title: "Glass heart" });
const { state, data } = story;
const stage = createStage({ bloom: { strength: 0.8, radius: 0.7, threshold: 0.35 } });
const { scene, renderer } = stage;
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const rim = new THREE.DirectionalLight(0xffffff, 1.5); rim.position.set(3, 3, -2); scene.add(rim);

// faint backdrop specks give the glass something to refract
const specks = new THREE.BufferGeometry();
const sp = new Float32Array(900 * 3).map(() => (Math.random() - 0.5) * 9);
specks.setAttribute("position", new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.Points(specks, new THREE.PointsMaterial({ size: 0.015, color: 0x6f737c, transparent: true, opacity: 0.5 })));

const smoothGeo = makeHeartGeometry(6);
smoothGeo.computeBoundingBox();
const { min, max } = smoothGeo.boundingBox;
const split = {
  uSplit: { value: 0 }, uMinY: { value: min.y }, uMaxY: { value: max.y },
  uCut: { value: volumeCut(data.yes / data.rows, min.y, max.y) },
  uNoColor: { value: new THREE.Color("#3f7fd1") },
};
const lowGeo = makeHeartGeometry(2).toNonIndexed();
lowGeo.computeVertexNormals();

const glass = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color("#ffd9dc"), transmission: 1, thickness: 1.4, roughness: 0.06, ior: 1.45,
  attenuationColor: accentColor(), attenuationDistance: 1.6, clearcoat: 1, clearcoatRoughness: 0.05,
  iridescence: 0.35, iridescenceIOR: 1.3, specularIntensity: 1,
});
addSplitShader(glass, split);
const coreMat = new THREE.MeshBasicMaterial({ color: accentColor() });
addSplitShader(coreMat, split);
addEventListener("accentchange", () => { glass.attenuationColor.copy(accentColor()); coreMat.color.copy(accentColor()); });

const group = new THREE.Group();
scene.add(group);
const shell = new THREE.Mesh(smoothGeo, glass);
const core = new THREE.Mesh(smoothGeo, coreMat);
core.scale.setScalar(0.42);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(lowGeo, 1),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 }));
edges.visible = false;
group.add(shell, core, edges);

// Smooth / low-poly toggle lives in the dev panel
const row = document.createElement("div");
row.className = "row";
row.innerHTML = `<span>Shape</span><button data-shape="smooth" aria-pressed="true">Smooth glass</button><button data-shape="low" aria-pressed="false">Low-poly</button>`;
document.querySelector(".devpanel").appendChild(row);
row.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const low = b.dataset.shape === "low";
  shell.geometry = low ? lowGeo : smoothGeo;
  glass.flatShading = low; glass.roughness = low ? 0.18 : 0.06; glass.needsUpdate = true;
  edges.visible = low;
  row.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
});

stage.loop((dt, t) => {
  story.update(dt);
  driveMeshHeart(group, state, t, split);
  core.scale.setScalar(0.42 + beat(t) * 0.06); // the light inside beats harder than the shell
});
</script>
</body>
</html>
